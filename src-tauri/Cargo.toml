[package]
name = "vyro"
description = "Vyro hardware monitor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-log = "2.9.2"
tauri-plugin-notification = "2.4.0"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-updater = "2"
vyro-core = { path = "../crates/vyro-core" }

[lints]
workspace = true

# Trimming and suspending WebView2 while the window is hidden (same versions wry uses).
[target."cfg(windows)".dependencies]
webview2-com = "0.38"
windows-core = "0.61"
# Showing the game overlay without taking focus, keeping widgets in view through Show desktop
# (pin.rs) and snapping them while dragged (snap.rs). Same version Tauri uses.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
