[package]
name = "vyro-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
base64 = "0.22.1"
fastrand = "2.5.0"
getrandom = "0.3.4"
hkdf = "0.12.4"
httparse = "1.10.1"
indexmap = { version = "2.11.4", features = ["serde"] }
log = "0.4.34"
qrcodegen = "1.8.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
str0m = { version = "0.24.1", default-features = false, features = ["rust-crypto"] }
thiserror = "2.0.21"
ts-rs = "12.0.1"
tungstenite = { version = "0.28.0", default-features = false, features = ["handshake", "__rustls-tls"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_TpmBaseServices", "Win32_System_EventLog", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_System_ProcessStatus", "Win32_System_Com", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Power", "Win32_System_Shutdown", "Wdk_System_SystemInformation", "Wdk_Graphics_Direct3D", "Win32_System_LibraryLoader", "Win32_Devices_Display", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Storage_FileSystem", "Win32_Storage_IscsiDisc", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_WindowsFirewall", "Win32_Networking_WinSock", "Win32_System_Pipes", "Win32_Security_Authorization", "Win32_System_Services", "Win32_Devices_DeviceQuery", "Win32_Devices_Properties", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Bluetooth", "Win32_Devices_HumanInterfaceDevice", "Win32_Media_KernelStreaming", "Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile", "Devices_Bluetooth_Rfcomm", "Foundation", "Win32_Devices_FunctionDiscovery", "Win32_UI_Input_XboxController", "Win32_Media_Audio", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage"] }
windows-future = "0.3.2"
nvml-wrapper = "0.13"
wmi = "0.18"
