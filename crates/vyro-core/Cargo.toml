[package]
name = "vyro-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fastrand = "2.5.0"
indexmap = { version = "2.11.4", features = ["serde"] }
log = "0.4.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
ts-rs = "12.0.1"

[lints]
workspace = true

[dev-dependencies]
sha2 = "0.11.0"
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_System_TpmBaseServices", "Win32_System_EventLog", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_ProcessStatus", "Win32_System_Com", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Power", "Wdk_System_SystemInformation", "Wdk_Graphics_Direct3D", "Win32_System_LibraryLoader", "Win32_Devices_Display", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Storage_FileSystem", "Win32_Storage_IscsiDisc", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi", "Win32_Networking_WinSock"] }
nvml-wrapper = "0.13"
wmi = "0.18"
