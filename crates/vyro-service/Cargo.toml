[package]
name = "vyro-service"
description = "Vyro sensor service: runs the engine elevated and serves it to the app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
log = "0.4.34"
vyro-core = { path = "../vyro-core" }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Services"] }

[lints]
workspace = true
