[workspace]
resolver = "2"
members = ["crates/vyro-core", "src-tauri"]
# src-tauri needs WebView2 (Windows) / webkit2gtk (Linux) to build; the core crate builds anywhere.
default-members = ["crates/vyro-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
