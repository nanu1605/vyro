name: Relay

# Deploys the Clokrix relay (relay/: a Cloudflare Worker with one Durable Object per PC) and the
# phone app it serves (phone.html, built into relay/public) to the owner's Cloudflare account.
# By hand only, on the owner's go: the relay is shared by every installed Clokrix that reaches its PC
# from anywhere. Two ways to start it:
#   - Actions → Relay → Run workflow, with the ref to deploy (GitHub offers this only for a file
#     on the default branch, main, so this file is on main ahead of the release that needs it);
#   - push a tag named relay-<anything> on the commit to deploy (git tag relay-<date> <commit>;
#     git push origin relay-<date>).
# Phones get the new app the next time they open it; keep the sealed messages' version (PROTOCOL)
# able to talk to released apps.
#
# Needs, in the repository settings (Secrets and variables → Actions):
#   secret   CLOUDFLARE_API_TOKEN    a token from the "Edit Cloudflare Workers" template
#   secret   CLOUDFLARE_ACCOUNT_ID   the account's id (Workers & Pages → Overview, right side)
#   variable CLOKRIX_RELAY_HOST      optional (2.5.2): a host on a domain in the same Cloudflare
#                                    account, such as clokrix-remote.example.com. The relay is then
#                                    also there (wrangler adds the DNS record and certificate),
#                                    beside its workers.dev address, which stays for phones paired
#                                    through it and for apps that carry it.
# After the first deploy, set the variable CLOKRIX_RELAY_URL to the address it prints (with
# CLOKRIX_RELAY_HOST, https://<that host>), so builds carry it (ci.yml, release.yml).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy (normally main)
        required: true
        default: main
  push:
    tags: ['relay-*']

permissions:
  contents: read

concurrency:
  group: relay-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy the relay
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Run by hand: the ref given; by a relay-* tag: that tag.
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            relay/pnpm-lock.yaml
      - name: Secrets are set
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != true ] || [ "$HAS_ACCOUNT" != true ]; then
            echo "::error::Set the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID first (see this file's header)"
            exit 1
          fi
      - name: The relay's own host, if set, is a host name
        env:
          RELAY_HOST: ${{ vars.CLOKRIX_RELAY_HOST }}
        run: |
          RELAY_HOST="${RELAY_HOST,,}"
          if [ -n "$RELAY_HOST" ] && ! [[ "$RELAY_HOST" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$ ]]; then
            echo "::error::CLOKRIX_RELAY_HOST is a host name alone, like clokrix-remote.example.com (no https://, no path)"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: The phone app (relay/public)
        run: pnpm build:phone
      - run: pnpm --dir relay install --frozen-lockfile
      - run: pnpm --dir relay check
      - run: pnpm --dir relay test
      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          DEPLOY_REF: ${{ inputs.ref || github.ref_name }}
          RELAY_HOST: ${{ vars.CLOKRIX_RELAY_HOST }}
        run: |
          set -o pipefail  # a failed deploy fails the step, through tee
          RELAY_HOST="${RELAY_HOST,,}"
          domain=()
          if [ -n "$RELAY_HOST" ]; then domain+=(--domain "$RELAY_HOST"); fi
          pnpm --dir relay exec wrangler deploy "${domain[@]}" | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          {
            echo "### Relay deployed"
            echo
            echo "From \`$DEPLOY_REF\` ($(git rev-parse --short HEAD))."
            if [ -n "$url" ]; then
              echo
              echo "Address: $url"
              echo
              echo "Builds carry it once the repository variable CLOKRIX_RELAY_URL is set to it."
            fi
            if [ -n "$RELAY_HOST" ]; then
              echo
              echo "Also at https://$RELAY_HOST: from 2.5.2, set CLOKRIX_RELAY_URL to it, so builds carry it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
