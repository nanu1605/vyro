name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-and-frontend:
    name: Core + frontend (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: cargo fmt --all --check
      - run: cargo clippy -p clokrix-core -p clokrix-service --all-targets -- -D warnings
      - name: Test core (regenerates TypeScript bindings from scratch)
        run: |
          rm -rf src/bindings
          cargo test -p clokrix-core
      - name: Test the sensor service (serves a simulated engine over a Unix socket)
        run: cargo test -p clokrix-service
      - name: TypeScript bindings match the Rust structs
        run: |
          if [ -n "$(git status --porcelain -- src/bindings)" ]; then
            git status --short -- src/bindings
            echo "::error::src/bindings is stale; run 'cargo test -p clokrix-core' and commit the result"
            exit 1
          fi

      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:phone
      - name: Front-end size budget (what each page loads at start)
        run: python3 scripts/bundle_budget.py --check
      - name: Third-party notices match Cargo.lock
        run: python3 scripts/third_party.py --check
      - name: Version is the same in every manifest
        run: python3 scripts/set-version.py --check

  accessibility:
    name: Accessibility (every tab and theme)
    # Pinned: Playwright installs its browser's system packages per Ubuntu release, and
    # ubuntu-latest moves to a release this Playwright version does not know (2026-10-19).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Browser for the sweep
        run: pnpm exec playwright install --with-deps chromium
      - name: axe-core on every tab, theme and width; dialogs; companion; keyboard; reduced motion
        run: pnpm a11y

  relay:
    name: Relay and phone app (Linux)
    # Pinned for Playwright, as the accessibility job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            relay/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:phone
      - name: The relay's own packages (Wrangler, workerd)
        run: pnpm --dir relay install --frozen-lockfile
      - run: pnpm --dir relay check
      - name: The relay in workerd, with PCs and phones played by sockets
        run: pnpm --dir relay test
      - name: Browser for the end-to-end run
        run: pnpm exec playwright install --with-deps chromium
      - name: The PC for it (the companion example, simulated readings)
        run: cargo build -p clokrix-core --example companion
      - name: End to end - relay, PC and phone app; pairing, readings, nothing readable on the wire, axe
        env:
          SHOTS: shots
        run: node scripts/relay-e2e.mjs
      - name: Phone app screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-app-screens-${{ github.sha }}
          path: shots/
          if-no-files-found: ignore
          retention-days: 14

  tauri-windows:
    name: Tauri app (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test core (includes the named-pipe IPC tests)
        run: cargo test -p clokrix-core
      - run: cargo test -p clokrix-service
      - name: Test the app's own logic
        run: cargo test -p clokrix
      - name: Inventory on a real Windows machine (for eyeballing)
        run: cargo run -p clokrix-core --example inventory -- --no-wait
      - name: Live sensors on a real Windows machine (for eyeballing)
        run: cargo run -p clokrix-core --example live -- --no-wait --samples 3
      - name: A desktop as large as a real monitor for the screen checks
        shell: pwsh
        run: ./scripts/ci-display.ps1
      - name: Screen capture and H.264 on a real Windows machine (1.7, for eyeballing)
        # Lines the tests print as "screen: ..." become annotations on the run.
        shell: bash
        run: |
          set -o pipefail
          cargo test -p clokrix-core screen:: -- --nocapture 2>&1 | sed -E 's/^.*screen: (.*)$/::notice title=Screen test::\1/'
      - name: The screen in a real browser (1.7)
        # The app's producer (Desktop Duplication, Windows' own encoder) into a WebRTC session on
        # this machine, played by the runner's Google Chrome (or Edge) as a phone plays it.
        run: node scripts/screen-check.mjs
      - name: A monitor larger than 1080p, scaled, through Windows' encoder, in a real browser
        # A moving 2560×1440 test screen sent as the app sends it (scaled to 1920×1080); the
        # H.264 Windows' encoder gave out is kept for reading.
        run: node scripts/screen-check.mjs --test 2560x1440 --dump screen-2560.h264
      - name: The H.264 Windows' encoder gave out (each picture's headers, for reading)
        if: always()
        shell: pwsh
        run: Get-Content screen-2560.h264.txt -TotalCount 80 -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-h264-${{ github.sha }}
          path: screen-2560.h264*
          if-no-files-found: ignore
          retention-days: 14
      - name: A voice clip pasted into a real browser (1.7)
        # The clip as the app makes it (AAC through Media Foundation) on the clipboard as a file,
        # Ctrl+V pressed as the phone's Paste key presses it: the page must receive the file.
        run: node scripts/clip-check.mjs
      - name: The runner's desktop size again
        if: always()
        shell: pwsh
        run: ./scripts/ci-display.ps1 -Reset
      - name: Fetch the bundled PawnIO installer (pinned SHA-256)
        shell: pwsh
        run: ./scripts/fetch-pawnio.ps1
      - name: Fetch the bundled PresentMon (pinned SHA-256)
        shell: pwsh
        run: ./scripts/fetch-presentmon.ps1
      - name: Build the app and the MSI installer
        env:
          # The relay built into the app (1.4); empty until the owner sets the variable.
          CLOKRIX_RELAY_URL: ${{ vars.CLOKRIX_RELAY_URL }}
        run: pnpm tauri build
      - name: The relay address built in (1.4)
        shell: pwsh
        env:
          CLOKRIX_RELAY_URL: ${{ vars.CLOKRIX_RELAY_URL }}
        run: |
          $url = $env:CLOKRIX_RELAY_URL
          if (-not $url) {
            "Relay built in: none (the variable CLOKRIX_RELAY_URL is not set)" |
              Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes('target\release\clokrix.exe'))
          if (-not $text.Contains($url)) { throw "clokrix.exe does not carry the relay address $url" }
          "Relay built in: $url" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
      - name: Installer size budget (spec §8, < 60 MB since 1.1)
        shell: pwsh
        run: |
          $msi = Get-Item target\release\bundle\msi\*.msi | Select-Object -First 1
          $exe = Get-Item target\release\clokrix.exe
          $mb = [math]::Round($msi.Length / 1MB, 2)
          "Installer: $($msi.Name) $mb MB; clokrix.exe $([math]::Round($exe.Length / 1MB, 2)) MB" |
            Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
          if ($msi.Length -ge 60MB) { throw "installer is $mb MB, over the 60 MB budget" }

      # P27: the runner has never had Clokrix. Install the MSI as a user would (silently here),
      # check what it put where, ask the service over its pipe, then uninstall and check what
      # went and what stayed.
      - name: Build the service probe
        run: cargo build -p clokrix-core --example probe
      - name: Clean install, probe the service, uninstall
        shell: pwsh
        run: |
          # On failure, the reason, the logs' last lines and anything Defender caught become
          # annotations on the run (job logs are not always at hand).
          function Tell($title, $text) {
            $t = (($text | Out-String).Trim() -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')
            if ($t) { Write-Host "::notice title=$title::$t" }
          }
          trap {
            Tell 'App log' (Get-Content "$env:LOCALAPPDATA\app.clokrix.monitor\logs\*.log" -Tail 25 -ErrorAction SilentlyContinue)
            Tell 'Service log' (Get-Content "$env:ProgramData\Clokrix\*.log" -Tail 15 -ErrorAction SilentlyContinue)
            Tell 'Defender' (Get-MpThreatDetection -ErrorAction SilentlyContinue | Select-Object -Last 5 | Format-List | Out-String)
            Write-Host "::error title=Clean install::$($_.Exception.Message -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')"
            break
          }
          $msi = (Get-Item target\release\bundle\msi\*.msi | Select-Object -First 1).FullName
          function Msi($verb, $log) {
            $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "$verb `"$msi`" /qn /norestart /l*v `"$log`""
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 60; throw "msiexec $verb failed: $($p.ExitCode)" }
          }
          Msi '/i' "$env:RUNNER_TEMP\install.log"

          $dir = Join-Path $env:ProgramFiles 'Clokrix'
          foreach ($f in 'clokrix.exe', 'clokrix-service.exe', 'PresentMon.exe', 'pawnio\PawnIO_setup.exe',
                         'THIRD_PARTY_NOTICES.md', 'LICENSE-MIT', 'LICENSE-APACHE') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "not installed: $f" }
          }
          $svc = Get-CimInstance Win32_Service -Filter "Name='ClokrixService'"
          if (-not $svc) { throw 'ClokrixService is not registered' }
          if ($svc.StartMode -ne 'Auto' -or $svc.StartName -ne 'LocalSystem') {
            throw "ClokrixService starts $($svc.StartMode) as $($svc.StartName)"
          }
          $recovery = sc.exe qfailure ClokrixService | Out-String
          if ($recovery -notmatch 'RESTART') { $recovery; throw 'ClokrixService does not restart after a failure' }
          $pawnio = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\PawnIO' -ErrorAction SilentlyContinue

          # Started by the installer without waiting; the probe waits for it to answer.
          .\target\debug\examples\probe.exe --wait 120 --watch 30 | Tee-Object -FilePath probe.md
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:ProgramData\Clokrix\*.log" -Tail 60 -ErrorAction SilentlyContinue
            throw 'the installed service did not answer'
          }
          $data = Join-Path $env:ProgramData 'Clokrix'
          if (-not (Test-Path "$data\history.sqlite")) { throw "no history in $data" }

          # The installed app through its real IPC (src-tauri/src/smoke.rs, after 1.1's first
          # field check): the pages' data commands answer, a desktop widget saved as the Widgets
          # page saves it opens and loads, stays over the desktop through Show desktop (1.1.1;
          # skipped where the runner has no desktop to show), snaps to the screen's corner when
          # dragged near it with the mouse and follows the pointer out again, lets clicks through
          # when locked so (1.2), and quitting as the tray does ends the process.
          $smoke = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $env:CLOKRIX_SMOKE = $smoke
          $app = Start-Process (Join-Path $dir 'clokrix.exe') -PassThru
          $env:CLOKRIX_SMOKE = $null
          if (-not $app.WaitForExit(150000)) {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            Get-Content "$env:LOCALAPPDATA\app.clokrix.monitor\logs\*.log" -Tail 60 -ErrorAction SilentlyContinue
            throw 'the app did not finish its smoke test, or did not quit'
          }
          if (-not (Test-Path $smoke)) { throw "the app wrote no smoke result (exit $($app.ExitCode))" }
          $result = Get-Content $smoke -Raw | ConvertFrom-Json
          if (-not $result.ok) {
            Get-Content $smoke
            Get-Content "$env:LOCALAPPDATA\app.clokrix.monitor\logs\*.log" -Tail 60 -ErrorAction SilentlyContinue
            throw "app smoke test failed: $($result.failures -join '; ')"
          }
          $timings = ($result.steps | ForEach-Object { "$($_.name) $($_.ms) ms" }) -join ', '
          $checks = "Show desktop: $($result.show_desktop); snap: $($result.snap); click-through: $($result.click_through)"
          Write-Host "App smoke test: $timings; $checks"

          Msi '/x' "$env:RUNNER_TEMP\uninstall.log"
          if (Get-Service ClokrixService -ErrorAction SilentlyContinue) { throw 'ClokrixService is still registered' }
          # For the record (Tauri's own shortcuts): what the uninstall left besides the user's data.
          $menu = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\Clokrix'
          $stayed = @(
            if (Test-Path $dir) { "$dir ($((Get-ChildItem -Recurse $dir -Name) -join ', '))" }
            if (Test-Path $menu) { $menu }
            if (Test-Path "$env:PUBLIC\Desktop\Clokrix.lnk") { "$env:PUBLIC\Desktop\Clokrix.lnk" }
            if (Test-Path 'HKCU:\Software\Clokrix') { 'HKCU\Software\Clokrix' }
          )
          if ($stayed) { Write-Host "::notice title=Left after the uninstall::$($stayed -join '; ')" }
          if (Test-Path (Join-Path $dir 'clokrix-service.exe')) { throw 'program files left behind' }
          # User data stays, as for any uninstall (the WiX notes in src-tauri/wix/clokrix.wxs).
          if (-not (Test-Path "$data\history.sqlite")) { throw 'the history was removed' }

          @(
            (Get-Content probe.md -Raw).TrimEnd(),
            "| Installed | $dir; ClokrixService automatic, LocalSystem, restarts on failure |",
            "| PawnIO | $(if ($pawnio) { "installed ($($pawnio.DisplayVersion))" } else { 'not installed (the app then asks for it)' }) |",
            "| App | $timings; the widget's window opened (without taking focus) and loaded; $checks; Quit ended the app |",
            '| Uninstalled | service and program files removed; history kept in %ProgramData%\Clokrix |'
          ) -join "`n" | Add-Content $env:GITHUB_STEP_SUMMARY

      # 2.2: Vyro became Clokrix. The runner gets Vyro 2.1.0 as released, run once and left as a
      # user leaves it, then this build's MSI over it as the app's updater installs it: Windows
      # replaces Vyro (the same upgrade code), and the service and the app carry Vyro's folders,
      # "Start with Windows" and notification registration over (clokrix_core::rename).
      - name: Upgrade from Vyro 2.1.0, then uninstall
        shell: pwsh
        run: |
          function Tell($title, $text) {
            $t = (($text | Out-String).Trim() -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')
            if ($t) { Write-Host "::notice title=$title::$t" }
          }
          trap {
            Tell 'App log' (Get-Content "$env:LOCALAPPDATA\app.clokrix.monitor\logs\*.log" -Tail 25 -ErrorAction SilentlyContinue)
            Tell 'Service log' (Get-Content "$env:ProgramData\Clokrix\*.log", "$env:ProgramData\Vyro\*.log" -Tail 15 -ErrorAction SilentlyContinue)
            Write-Host "::error title=Upgrade from Vyro::$($_.Exception.Message -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')"
            break
          }
          function Msi($verb, $file, $log) {
            $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "$verb `"$file`" /qn /norestart /l*v `"$log`""
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 60; throw "msiexec $verb $file failed: $($p.ExitCode)" }
          }
          # What an install of `$name` left: its folder (and what is in it), Start menu entry,
          # desktop shortcut and Tauri's key in HKCU.
          function Leftovers($name) {
            $dir = Join-Path $env:ProgramFiles $name
            $menu = Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs\$name"
            @(
              if (Test-Path $dir) { "$dir ($((Get-ChildItem -Recurse $dir -Name) -join ', '))" }
              if (Test-Path $menu) { "$menu ($((Get-ChildItem -Recurse $menu -Name) -join ', '))" }
              if (Test-Path "$env:PUBLIC\Desktop\$name.lnk") { "$env:PUBLIC\Desktop\$name.lnk" }
              if (Test-Path "HKCU:\Software\$name") { "HKCU\Software\$name" }
            )
          }
          function Until($what, $seconds, [scriptblock]$ok) {
            $end = (Get-Date).AddSeconds($seconds)
            while (-not (& $ok)) {
              if ((Get-Date) -gt $end) { throw "$what (waited $seconds s)" }
              Start-Sleep -Milliseconds 500
            }
          }
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $toasts = 'HKCU:\Software\Classes\AppUserModelId'
          # A machine that only ever had Vyro: what the clean install above kept goes first.
          Remove-Item -Recurse -Force "$env:ProgramData\Clokrix", "$env:APPDATA\app.clokrix.monitor",
            "$env:LOCALAPPDATA\app.clokrix.monitor" -ErrorAction SilentlyContinue

          $old = Join-Path $env:RUNNER_TEMP 'Vyro_2.1.0_x64_en-US.msi'
          Invoke-WebRequest 'https://github.com/nanu1605/vyro-releases/releases/download/v2.1.0/Vyro_2.1.0_x64_en-US.msi' -OutFile $old
          $hash = (Get-FileHash $old -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '2c25b49ec013444098f670ae2eae47e7e3a6d854891239955ffbeb174084f286') { throw "not the released Vyro 2.1.0 MSI: $hash" }
          Msi '/i' $old "$env:RUNNER_TEMP\vyro-install.log"
          Until 'VyroService did not start' 90 { (Get-Service VyroService -ErrorAction SilentlyContinue).Status -eq 'Running' }
          Until 'VyroService kept no history' 90 { Test-Path "$env:ProgramData\Vyro\history.sqlite" }
          # Vyro's app, once (its own smoke run): its folders, WebView2's data, its toast registration.
          $smoke = Join-Path $env:RUNNER_TEMP 'vyro-smoke.json'
          $env:VYRO_SMOKE = $smoke
          $app = Start-Process "$env:ProgramFiles\Vyro\vyro.exe" -PassThru
          $env:VYRO_SMOKE = $null
          if (-not $app.WaitForExit(150000)) { Stop-Process -Id $app.Id -Force; throw 'Vyro 2.1.0 did not finish its smoke run' }
          foreach ($d in "$env:APPDATA\app.vyro.monitor", "$env:LOCALAPPDATA\app.vyro.monitor\EBWebView") {
            if (-not (Test-Path $d)) { throw "Vyro 2.1.0 left no $d" }
          }
          # And as a user leaves it: things of its own in each folder, "Start with Windows" on.
          foreach ($d in "$env:ProgramData\Vyro", "$env:APPDATA\app.vyro.monitor", "$env:LOCALAPPDATA\app.vyro.monitor") {
            'kept since Vyro' | Set-Content (Join-Path $d 'upgrade-marker.txt')
          }
          Set-ItemProperty $run -Name Vyro -Value "`"$env:ProgramFiles\Vyro\vyro.exe`" --minimized"
          if (-not (Test-Path "$toasts\app.vyro.monitor")) { throw 'Vyro 2.1.0 registered no notifications' }

          # This build over it.
          $msi = (Get-Item target\release\bundle\msi\*.msi | Select-Object -First 1).FullName
          Msi '/i' $msi "$env:RUNNER_TEMP\upgrade.log"
          $listed = @(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -in 'Vyro', 'Clokrix' })
          if ($listed.Count -ne 1 -or $listed[0].DisplayName -ne 'Clokrix' -or $listed[0].Publisher -ne 'Clokrix') {
            throw "installed programs: $(($listed | ForEach-Object { "$($_.DisplayName) by $($_.Publisher)" }) -join ', ')"
          }
          if (Get-Service VyroService -ErrorAction SilentlyContinue) { throw 'VyroService is still registered' }
          # Windows leaves Vyro's shortcuts (Tauri keeps their components' key paths in HKCU); the
          # MSI removes them by name (clokrix.wxs).
          $left = Leftovers 'Vyro'
          if ($left) { throw "Vyro left: $($left -join '; ')" }
          # The service carries its data over as it starts; the app its part at its first start.
          Until 'ClokrixService did not carry %ProgramData%\Vyro over' 90 { Test-Path "$env:ProgramData\Clokrix\upgrade-marker.txt" }
          if (Test-Path "$env:ProgramData\Vyro") { throw '%ProgramData%\Vyro is still there' }
          if (-not (Test-Path "$env:ProgramData\Clokrix\history.sqlite")) { throw "Vyro's history did not come along" }
          $dir = Join-Path $env:ProgramFiles 'Clokrix'
          $smoke = Join-Path $env:RUNNER_TEMP 'upgrade-smoke.json'
          $env:CLOKRIX_SMOKE = $smoke
          $app = Start-Process (Join-Path $dir 'clokrix.exe') -PassThru
          $env:CLOKRIX_SMOKE = $null
          if (-not $app.WaitForExit(150000)) { Stop-Process -Id $app.Id -Force; throw 'the app did not finish its smoke test after the upgrade' }
          $result = Get-Content $smoke -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw "app smoke test after the upgrade failed: $($result.failures -join '; ')" }
          foreach ($base in $env:APPDATA, $env:LOCALAPPDATA) {
            if (-not (Test-Path "$base\app.clokrix.monitor\upgrade-marker.txt")) { throw "$base\app.vyro.monitor was not carried over" }
            if (Test-Path "$base\app.vyro.monitor") { throw "$base\app.vyro.monitor is still there" }
          }
          if (-not (Test-Path "$env:LOCALAPPDATA\app.clokrix.monitor\EBWebView")) { throw "WebView2's data did not come along" }
          $entries = Get-ItemProperty $run
          if ($entries.Vyro) { throw "Vyro's Run entry is still there" }
          if ($entries.Clokrix -ne "`"$dir\clokrix.exe`" --minimized") { throw "Start with Windows was not carried over: '$($entries.Clokrix)'" }
          if (Test-Path "$toasts\app.vyro.monitor") { throw "Vyro's notification registration is still there" }
          $toast = Get-ItemProperty "$toasts\app.clokrix.monitor"
          if ($toast.DisplayName -ne 'Clokrix' -or -not (Test-Path $toast.IconUri)) { throw "notifications: $($toast.DisplayName), icon $($toast.IconUri)" }

          # Uninstalled: both names leave the registry; the data stays, as for any uninstall.
          Msi '/x' $msi "$env:RUNNER_TEMP\upgrade-uninstall.log"
          $entries = Get-ItemProperty $run
          if ($entries.Clokrix -or $entries.Vyro) { throw 'a Run entry stayed after the uninstall' }
          if ((Test-Path "$toasts\app.clokrix.monitor") -or (Test-Path "$toasts\app.vyro.monitor")) { throw 'a notification registration stayed' }
          if (-not (Test-Path "$env:ProgramData\Clokrix\upgrade-marker.txt")) { throw 'the uninstall removed the data' }
          @(
            '| Upgrade from Vyro 2.1.0 | one program, Clokrix by Clokrix; VyroService and Program Files\Vyro gone |',
            '| Carried over | %ProgramData%\Vyro (history), both app folders (with WebView2), Start with Windows, notifications (with the icon) |',
            '| Uninstalled after it | Run entries and notification registrations of both names removed; data kept |'
          ) -join "`n" | Add-Content $env:GITHUB_STEP_SUMMARY

      # Ready-to-run downloads for checking on a real PC without a toolchain.
      - name: Collect Windows binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-win | Out-Null
          Copy-Item target\debug\examples\inventory.exe dist-win\clokrix-inventory.exe
          Copy-Item target\debug\examples\live.exe dist-win\clokrix-live.exe
          cargo build -p clokrix-core --example remote
          Copy-Item target\debug\examples\remote.exe dist-win\clokrix-remote.exe
          cargo build -p clokrix-core --example fans
          Copy-Item target\debug\examples\fans.exe dist-win\clokrix-fans.exe
          Copy-Item target\debug\examples\probe.exe dist-win\clokrix-probe.exe
          Copy-Item target\release\clokrix-service.exe dist-win\clokrix-service.exe
          Copy-Item target\release\clokrix.exe dist-win\clokrix.exe
          Copy-Item target\release\bundle\msi\*.msi dist-win\
      - uses: actions/upload-artifact@v4
        with:
          name: clokrix-windows-${{ github.sha }}
          path: dist-win/
