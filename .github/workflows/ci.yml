name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-and-frontend:
    name: Core + frontend (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: cargo fmt --all --check
      - run: cargo clippy -p vyro-core --all-targets -- -D warnings
      - name: Test core (regenerates TypeScript bindings from scratch)
        run: |
          rm -rf src/bindings
          cargo test -p vyro-core
      - name: TypeScript bindings match the Rust structs
        run: |
          if [ -n "$(git status --porcelain -- src/bindings)" ]; then
            git status --short -- src/bindings
            echo "::error::src/bindings is stale; run 'cargo test -p vyro-core' and commit the result"
            exit 1
          fi

      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Third-party notices match Cargo.lock
        run: python3 scripts/third_party.py --check

  tauri-windows:
    name: Tauri app (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p vyro-core
      - name: Inventory on a real Windows machine (for eyeballing)
        run: cargo run -p vyro-core --example inventory -- --no-wait
      - name: Live sensors on a real Windows machine (for eyeballing)
        run: cargo run -p vyro-core --example live -- --no-wait --samples 3
      - name: Fetch the bundled PawnIO installer (pinned SHA-256)
        shell: pwsh
        run: ./scripts/fetch-pawnio.ps1
      - name: Build the app and the MSI installer
        run: pnpm tauri build

      # Ready-to-run downloads for checking on a real PC without a toolchain.
      - name: Collect Windows binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-win | Out-Null
          Copy-Item target\debug\examples\inventory.exe dist-win\vyro-inventory.exe
          Copy-Item target\debug\examples\live.exe dist-win\vyro-live.exe
          Copy-Item target\release\vyro.exe dist-win\vyro.exe
          Copy-Item target\release\bundle\msi\*.msi dist-win\
      - uses: actions/upload-artifact@v4
        with:
          name: vyro-windows-${{ github.sha }}
          path: dist-win/
          retention-days: 14
