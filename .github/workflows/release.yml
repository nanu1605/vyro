name: Release

# Builds the signed-for-update MSI and publishes it as a GitHub release, with the `latest.json`
# the app's updater reads. Start it from the Actions tab ("Run workflow" on the branch to
# release) or by pushing a tag `vX.Y.Z`; the version comes from the files
# (`scripts/set-version.py`), and the tag must not exist yet when started from the Actions tab.
#
# Needs, in the repository settings (Secrets and variables → Actions):
#   secret   TAURI_SIGNING_PRIVATE_KEY           update signing key (`tauri signer generate`)
#   secret   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#   variable UPDATER_PUBKEY                      the matching public key (the .pub file; a secret works too)
# and, to keep this repository private:
#   variable RELEASES_REPO                       a public repository for the downloads only
#                                                (owner/name, created with a README)
#   secret   RELEASES_TOKEN                      fine-grained token: Contents read and write on it
# With RELEASES_REPO the installer and `latest.json` are also published there and installed
# copies update from it (release downloads of a private repository need a sign-in); without
# it they update from this repository's releases, which works only while it is public.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version and tag
        id: version
        shell: pwsh
        env:
          UPDATER_PUBKEY: ${{ vars.UPDATER_PUBKEY || secrets.UPDATER_PUBKEY }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
          HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
        run: |
          $version = python scripts/set-version.py --check
          if ($LASTEXITCODE -ne 0) { throw "version files disagree" }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne $tag) { throw "tag $env:GITHUB_REF_NAME does not match version $version (scripts/set-version.py)" }
          } elseif (git ls-remote --tags origin "refs/tags/$tag") {
            throw "$tag already exists: raise the version with scripts/set-version.py first"
          }
          if (-not $env:UPDATER_PUBKEY) { throw "UPDATER_PUBKEY (repository variable or secret) is not set" }
          if ($env:HAS_KEY -ne 'true') { throw "secret TAURI_SIGNING_PRIVATE_KEY is not set" }
          $hostRepo = if ($env:RELEASES_REPO) { $env:RELEASES_REPO.Trim() } else { $env:GITHUB_REPOSITORY }
          if ($env:RELEASES_REPO -and $env:HAS_RELEASES_TOKEN -ne 'true') { throw "RELEASES_REPO is set but the secret RELEASES_TOKEN is not" }
          "Updates come from https://github.com/$hostRepo/releases" >> $env:GITHUB_STEP_SUMMARY
          "host=$hostRepo" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Fetch the bundled PawnIO installer (pinned SHA-256)
        shell: pwsh
        run: ./scripts/fetch-pawnio.ps1
      - name: Fetch the bundled PresentMon (pinned SHA-256)
        shell: pwsh
        run: ./scripts/fetch-presentmon.ps1

      # Only release builds carry the updater; other builds never check (updates.rs).
      - name: Updater configuration
        shell: pwsh
        env:
          UPDATER_PUBKEY: ${{ vars.UPDATER_PUBKEY || secrets.UPDATER_PUBKEY }}
          HOST_REPO: ${{ steps.version.outputs.host }}
        run: |
          @{
            bundle = @{ createUpdaterArtifacts = $true }
            plugins = @{
              updater = @{
                pubkey = $env:UPDATER_PUBKEY.Trim()
                endpoints = @("https://github.com/$env:HOST_REPO/releases/latest/download/latest.json")
                windows = @{ installMode = 'passive' }
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 src-tauri/tauri.release.conf.json

      - name: Build the app and the MSI installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json

      - name: Installer, update manifest and checksums
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          HOST_REPO: ${{ steps.version.outputs.host }}
        run: |
          $msi = Get-Item target\release\bundle\msi\*.msi | Select-Object -First 1
          if ($msi.Length -ge 20MB) { throw "installer is $([math]::Round($msi.Length / 1MB, 2)) MB, over the 20 MB budget" }
          $sig = (Get-Content -Raw "$($msi.FullName).sig").Trim()
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $msi.FullName release\
          $url = "https://github.com/$env:HOST_REPO/releases/download/$env:TAG/$($msi.Name)"
          $platform = @{ signature = $sig; url = $url }
          @{
            version = $env:VERSION
            notes = "Vyro $env:VERSION"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ 'windows-x86_64' = $platform; 'windows-x86_64-msi' = $platform }
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 release\latest.json
          Get-ChildItem release -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii release\SHA256SUMS.txt
          Get-Content release\SHA256SUMS.txt | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

      # The downloads only: no source, no generated notes (they would link private commits).
      - name: Publish the downloads to the public releases repository
        if: vars.RELEASES_REPO != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          HOST_REPO: ${{ steps.version.outputs.host }}
        run: |
          gh release create $env:TAG (Get-ChildItem release -File).FullName --repo $env:HOST_REPO `
            --title "Vyro $env:VERSION" --notes "Vyro $env:VERSION for Windows 10/11 (x64). Install the MSI; installed copies update themselves."
          if ($LASTEXITCODE -ne 0) { throw "publishing to $env:HOST_REPO failed (does it exist with a README, and may RELEASES_TOKEN write to it?)" }

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create $env:TAG (Get-ChildItem release -File).FullName `
            --title "Vyro $env:VERSION" --generate-notes --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
